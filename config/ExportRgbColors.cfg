# Export RGB Colors add-in — copy this file to MicroStation\config\appl\
# then restart MicroStation. Adds a Drawing > Automation tab with
# Export RGB Colors, and loads the add-in with each DGN.

MS_DGNAPPS > ExportRgbColors

# If the DLL is not in mdlapps, uncomment and point at its folder:
# MS_ADDINPATH > C:/Tools/ExportRgbColors/

%if exists ($(MSDIR)mdlapps/ExportRgbColorsRibbon.xml)
  MS_RIBBONXML > $(MSDIR)mdlapps/ExportRgbColorsRibbon.xml
%elif exists ($(_USTN_DIRECTORY)mdlapps/ExportRgbColorsRibbon.xml)
  MS_RIBBONXML > $(_USTN_DIRECTORY)mdlapps/ExportRgbColorsRibbon.xml
%endif

%if exists ($(MSDIR)mdlapps/ExportRgbColorsNamedCommands.xml)
  MS_NAMEDCOMMANDSLIST > $(MSDIR)mdlapps/ExportRgbColorsNamedCommands.xml
%elif exists ($(_USTN_DIRECTORY)mdlapps/ExportRgbColorsNamedCommands.xml)
  MS_NAMEDCOMMANDSLIST > $(_USTN_DIRECTORY)mdlapps/ExportRgbColorsNamedCommands.xml
%endif
